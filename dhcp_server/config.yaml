---
version: 1.5.0r8
slug: dhcp_server
name: "DHCP server [IPv4]"
description: ISC DHCP 4.4.3_p1-r4
#url: https://home-assistant.io/addons/dhcp_server/
url: https://github.com/raphael1688dev/addons-dhcp-server/
#codenotary: notary@home-assistant.io
codenotary: odenotary@frenck.dev
advanced: true
arch:
  - aarch64
  - amd64
host_network: true
#image: homeassistant/{arch}-addon-dhcp_server
options:
  default_lease: 86400
  dns:
    - 8.8.8.8
    - 8.8.4.4
  ntp: []
  domain: null
  hosts: []
  max_lease: 172800
  networks:
    - broadcast: 192.168.1.255
      gateway: 192.168.1.1
      interface: eth0
      netmask: 255.255.255.0
      range_end: 192.168.1.200
      range_start: 192.168.1.100
      subnet: 192.168.1.0
schema:
  default_lease: int
  dns:
    - str
  ntp:
    - str
  domain: str
  hosts:
    - ip: str
      mac: str
      name: str
  max_lease: int
  networks:
    - broadcast: str
      gateway: str
      interface: str
      netmask: str
      range_end: str
      range_start: str
      subnet: str
startup: system
init: false
